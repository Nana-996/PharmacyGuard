<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pg-shield-grad" x1="64" y1="40" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="pg-cross-grad" x1="140" y1="140" x2="370" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="pg-check-grad" x1="190" y1="280" x2="380" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <linearGradient id="pg-check-inner" x1="210" y1="270" x2="350" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.75" />
    </linearGradient>
    <filter id="pg-glow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1D4ED8" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#pg-glow)">
    <!-- Outer Shield Outline -->
    <path d="M256 50 C344 54 420 80 432 108 C438 214 430 328 348 414 C308 456 270 478 256 486 C242 478 204 456 164 414 C82 328 74 214 80 108 C92 80 168 54 256 50 Z"
          stroke="url(#pg-shield-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Medical Cross -->
    <rect x="154" y="218" width="204" height="76" rx="16" fill="url(#pg-cross-grad)" />
    <rect x="218" y="154" width="76" height="204" rx="16" fill="url(#pg-cross-grad)" />

    <!-- Verification Checkmark (Outer Glow/Shadow) -->
    <path d="M204 246 C216 260 234 286 252 296 C262 301 274 298 286 284 C314 250 348 198 376 166 C354 186 322 226 288 266 C278 278 268 278 258 268 C246 256 230 236 218 226 C212 232 208 238 204 246 Z"
          fill="#0F766E" opacity="0.25" />

    <!-- Dynamic Verification Checkmark Body -->
    <path d="M206 242 C220 258 236 282 250 292 C260 299 272 296 284 280 C312 244 346 194 374 162 C350 182 320 224 286 264 C276 276 266 276 256 264 C244 252 228 232 216 222 C212 228 208 234 206 242 Z"
          fill="url(#pg-check-grad)" />

    <!-- Inner Highlight / Shine -->
    <path d="M212 238 C224 252 238 272 250 282 C258 288 268 286 278 272 C302 240 334 196 358 170 C340 188 314 224 284 258 C276 268 268 268 260 258 C248 246 232 228 222 218 C218 224 214 230 212 238 Z"
          fill="url(#pg-check-inner)" />
  </g>
</svg>
